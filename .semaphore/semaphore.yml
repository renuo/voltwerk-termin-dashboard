version: v1.0
name: termin-dashboard

agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404

auto_cancel:
  running:
    when: 'true'

fail_fast:
  cancel:
    when: branch != 'main'

global_job_config:
  secrets:
    - name: termin-dashboard

  prologue:
    commands:
      - checkout --use-cache
      - source .semaphore/bin/cache_restore rails
      - bundle config set deployment 'true'
      - bundle config set path 'vendor/bundle'
      - bundle install --retry 3

blocks:
  - name: linting
    dependencies: []
    execution_time_limit:
      minutes: 5
    task:
      jobs:
        - name: linting
          commands:
            - bin/fastcheck

  - name: tests
    dependencies: []
    execution_time_limit:
      minutes: 10
    task:
      env_vars:
        - name: DATABASE_URL
          value: postgresql://postgres@localhost/test?encoding=utf8
        - name: RAILS_ENV
          value: test
      prologue:
        commands:
          - sem-service start postgres 18
          - cp .env.example .env
          - bundle exec rails db:create db:schema:load
      jobs:
        - name: tests
          commands:
            - bin/check
      epilogue:
        always:
          commands:
            - source .semaphore/bin/cache_store rails
            - mkdir -p log coverage tmp/screenshots tmp/capybara
            - artifact push job log
            - artifact push job tmp/screenshots
            - artifact push job tmp/capybara
            - zip -r coverage-$SEMAPHORE_GIT_SHA coverage/
            - artifact push job coverage-$SEMAPHORE_GIT_SHA.zip

promotions:
  - name: develop
    deployment_target: develop
    pipeline_file: develop-deploy.yml
    auto_promote:
      when: result = 'passed' and branch = 'develop'

  - name: main
    deployment_target: main
    pipeline_file: main-deploy.yml
    auto_promote:
      when: result = 'passed' and branch = 'main'
